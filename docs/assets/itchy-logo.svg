<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Itchy Toolbox logo">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#panel)"/>
  <rect x="18" y="18" width="1164" height="224" rx="12" fill="#080c10" stroke="#263847"/>
  <g font-family="Consolas, 'Courier New', monospace" font-weight="800" letter-spacing="2">
    <text x="70" y="112" font-size="72" fill="#6f7478">ITCHY</text>
    <text x="390" y="112" font-size="72" fill="#f8e98c" filter="url(#glow)">TOOLBOX</text>
    <text x="72" y="154" font-size="20" fill="#7f8c98">Windows kurulum ve teknik servis araci</text>
    <text x="72" y="190" font-size="18" fill="#69e8ff">dashboard menu</text>
    <text x="275" y="190" font-size="18" fill="#00e676">html rapor</text>
    <text x="430" y="190" font-size="18" fill="#f8e98c">winget kurulum</text>
    <text x="640" y="190" font-size="18" fill="#ff6b6b">onarim araclari</text>
  </g>
  <circle cx="1070" cy="64" r="9" fill="#ff6b6b"/>
  <circle cx="1100" cy="64" r="9" fill="#f8e98c"/>
  <circle cx="1130" cy="64" r="9" fill="#00e676"/>
</svg>
